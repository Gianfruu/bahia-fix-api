$kind: http-request
description: Permite filtrar por fecha, estado, clienteId y q; ordenar con sortBy/order; y paginar.
url: "{{base_url}}/turnos?page=1&limit=10&fecha=&estado=&clienteId=&q=&sortBy=fecha&order=asc"
method: GET
queryParams:
  page: "1"
  limit: "10"
  fecha: ""
  estado: ""
  clienteId: ""
  q: ""
  sortBy: fecha
  order: asc
scripts:
  - type: afterResponse
    code: |-
      pm.test('La respuesta HTTP es correcta', function () { pm.expect(pm.response.code).to.be.oneOf([200, 201]); });
      pm.test('La respuesta contiene el formato estándar', function () { const body = pm.response.json(); pm.expect(body).to.have.property('success', true); pm.expect(body).to.have.property('data'); pm.expect(body).to.have.property('message'); });
    language: text/javascript
order: 1000
