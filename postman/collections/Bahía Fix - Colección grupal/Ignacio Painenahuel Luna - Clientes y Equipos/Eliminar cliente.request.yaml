$kind: http-request
description: Elimina el cliente si no tiene equipos asociados. Si tiene equipos asociados, devuelve 409.
url: "{{base_url}}/clientes/{{cliente_nuevo_id}}"
method: DELETE
scripts:
  - type: afterResponse
    code: pm.test('Respuesta esperada', function () { pm.expect(pm.response.code).to.be.oneOf([200,404,409]); });
    language: text/javascript
order: 5000
