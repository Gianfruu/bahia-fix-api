$kind: http-request
description: Debe responder 400 indicando los campos obligatorios.
url: "{{base_url}}/clientes"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Devuelve 400', function () { pm.response.to.have.status(400); });
      pm.test('Formato de error', function () { const b=pm.response.json(); pm.expect(b.success).to.eql(false); pm.expect(b.data).to.eql(null); pm.expect(b.message).to.be.a('string'); });
    language: text/javascript
order: 3000
